name: Bug report
description: Report a reproducible PredatorLite defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach Acer binaries, firmware, serial numbers, machine-local keys, or unredacted diagnostics. Report security vulnerabilities through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: PredatorLite version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Laptop model
      placeholder: Predator PHN16-71
    validations:
      required: true
  - type: input
    id: bios
    attributes:
      label: BIOS version
      placeholder: V1.20
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, build number
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the starting state and the smallest repeatable sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
      description: Remove usernames, profile paths, serial numbers, and machine-specific values before attaching evidence.
