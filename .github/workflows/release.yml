name: release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options:
          - beta
          - rc
          - stable
      iteration:
        description: Beta or RC number; leave empty for stable
        required: false
        type: string
      confirm_public:
        description: Confirm public publication for RC or stable
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          msbuild-architecture: x64

      - name: Test release version policy
        shell: pwsh
        run: .\build\test-release-version.ps1

      - name: Check release state
        id: release_state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_ITERATION: ${{ inputs.iteration }}
          CONFIRM_PUBLIC: ${{ inputs.confirm_public }}
        run: |
          $ErrorActionPreference = "Stop"
          . (Join-Path $PWD "build\release-output.ps1")
          [xml]$buildProperties = Get-Content -LiteralPath "Directory.Build.props"
          $baseVersion = [string]($buildProperties.Project.PropertyGroup.Version | Select-Object -First 1)
          $release = Resolve-PredatorLiteReleaseVersion `
            -BaseVersion $baseVersion `
            -Channel $env:RELEASE_CHANNEL `
            -Iteration $env:RELEASE_ITERATION

          $confirmPublic = $env:CONFIRM_PUBLIC.Equals(
            "true",
            [System.StringComparison]::OrdinalIgnoreCase)
          if ($release.IsPublic -and -not $confirmPublic) {
            throw "$($release.Channel) releases require confirm_public."
          }
          if ($release.IsDraft -and $confirmPublic) {
            throw "Beta releases must not request public confirmation."
          }
          $isMainBranch = $env:GITHUB_REF.Equals(
            "refs/heads/main",
            [System.StringComparison]::OrdinalIgnoreCase)
          if (-not $isMainBranch -and -not $release.IsDraft) {
            throw "RC and Stable releases must run from the main branch. Non-main branches may create Beta drafts only."
          }

          $tag = "v$($release.ReleaseVersion)"
          "base_version=$baseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$($release.ReleaseVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "channel=$($release.Channel)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "is_draft=$($release.IsDraft.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "is_prerelease=$($release.IsPrerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          $response = @(& gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" 2>&1)
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            Write-Host "Release $tag already exists. The existing release will not be overwritten."
            "should_publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $responseText = $response -join [Environment]::NewLine
          if ($responseText -notmatch "404|Not Found") {
            throw "Could not determine whether release $tag exists: $responseText"
          }
          "should_publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $visibility = if ($release.IsDraft) { "an internal draft" } elseif ($release.IsPrerelease) { "a public prerelease" } else { "a public stable release" }
          Write-Host "Release $tag does not exist and will be created as $visibility after validation."
          exit 0

      - name: Install pinned Inno Setup
        if: steps.release_state.outputs.should_publish == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $uri = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $expectedHash = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          $installDirectory = Join-Path $env:RUNNER_TEMP "Inno Setup 6"
          Invoke-WebRequest -Uri $uri -OutFile $installer
          $stream = [System.IO.File]::OpenRead($installer)
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          try {
            $actualHash = ($sha256.ComputeHash($stream) | ForEach-Object { $_.ToString("x2") }) -join ""
          } finally {
            $sha256.Dispose()
            $stream.Dispose()
          }
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup installer hash mismatch: $actualHash"
          }
          $process = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/CURRENTUSER",
            "/DIR=`"$installDirectory`""
          ) -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)"
          }
          $compiler = Join-Path $installDirectory "ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "ISCC.exe was not installed to $installDirectory"
          }
          "INNO_SETUP_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore dependencies
        if: steps.release_state.outputs.should_publish == 'true'
        run: dotnet restore PredatorLite.slnx

      - name: Audit dependencies
        if: steps.release_state.outputs.should_publish == 'true'
        run: dotnet package list --project PredatorLite.slnx --vulnerable --include-transitive --no-restore

      - name: Build
        if: steps.release_state.outputs.should_publish == 'true'
        run: dotnet build PredatorLite.slnx -c Release --no-restore --nologo

      - name: Format
        if: steps.release_state.outputs.should_publish == 'true'
        env:
          Configuration: Release
        run: dotnet format PredatorLite.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Test
        if: steps.release_state.outputs.should_publish == 'true'
        run: dotnet test PredatorLite.slnx -c Release --no-build --nologo

      - name: Benchmark smoke
        if: steps.release_state.outputs.should_publish == 'true'
        run: dotnet run --project benchmarks/PredatorLite.Benchmarks/PredatorLite.Benchmarks.csproj -c Release --no-build -- --job Dry --filter "*"

      - name: Prepare release assets
        if: steps.release_state.outputs.should_publish == 'true'
        shell: pwsh
        env:
          BASE_VERSION: ${{ steps.release_state.outputs.base_version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_ITERATION: ${{ inputs.iteration }}
        run: |
          .\build\prepare-release.ps1 `
            -Configuration Release `
            -Version $env:BASE_VERSION `
            -Channel $env:RELEASE_CHANNEL `
            -Iteration $env:RELEASE_ITERATION

      - name: Validate release assets
        if: steps.release_state.outputs.should_publish == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release_state.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDirectory = "publish\release"
          $portableName = "PredatorLite-$env:RELEASE_VERSION-win-x64-portable.zip"
          $installerName = "PredatorLite-Setup-$env:RELEASE_VERSION-win-x64.exe"
          $expectedNames = @(
            $portableName,
            "$portableName.sha256",
            $installerName,
            "$installerName.sha256"
          )
          $entries = @(Get-ChildItem -LiteralPath $releaseDirectory -Force)
          $unexpected = @(
            $entries | Where-Object {
              $_.PSIsContainer -or
              $_.Name -notin $expectedNames -or
              $_.Name -match '(?i)unsigned|test-only|test-signed'
            }
          )
          if ($entries.Count -ne $expectedNames.Count -or $unexpected.Count -ne 0) {
            throw "Release directory contains unexpected assets."
          }

          foreach ($assetName in @($portableName, $installerName)) {
            $assetPath = Join-Path $releaseDirectory $assetName
            $hashPath = "$assetPath.sha256"
            $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = "$hash  $assetName`r`n"
            $actual = [System.IO.File]::ReadAllText($hashPath, [System.Text.Encoding]::ASCII)
            if ($actual -ne $expected) {
              throw "Checksum mismatch for $assetName."
            }
          }
          Write-Host "Validated release assets for v$env:RELEASE_VERSION."

      - name: Build and validate Store upload
        if: steps.release_state.outputs.should_publish == 'true' && steps.release_state.outputs.channel == 'stable'
        shell: pwsh
        env:
          BASE_VERSION: ${{ steps.release_state.outputs.base_version }}
        run: |
          $ErrorActionPreference = "Stop"
          .\build\build-store-package.ps1 `
            -Configuration Release `
            -Version $env:BASE_VERSION `
            -Mode StoreUpload
          .\build\test-store-package.ps1 `
            -PackagePath "publish\store\PredatorLite-Store-$env:BASE_VERSION-win-x64.msixupload" `
            -ExpectedVersion "$env:BASE_VERSION.0"

      - name: Upload Store candidate
        if: steps.release_state.outputs.should_publish == 'true' && steps.release_state.outputs.channel == 'stable'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PredatorLite-Store-${{ steps.release_state.outputs.base_version }}-win-x64
          path: |
            publish/store/PredatorLite-Store-${{ steps.release_state.outputs.base_version }}-win-x64.msixupload
            publish/store/PredatorLite-Store-${{ steps.release_state.outputs.base_version }}-win-x64.msixupload.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Write release notes
        if: steps.release_state.outputs.should_publish == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release_state.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.release_state.outputs.channel }}
          RELEASE_TAG: ${{ steps.release_state.outputs.tag }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}\predatorlite-release-notes.md
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $distributionNotice = switch ($env:RELEASE_CHANNEL) {
            "beta" { "Internal beta draft. Do not redistribute this build outside the PredatorLite maintainer group." }
            "rc" { "Public release candidate. This build may still contain defects and is not the final release." }
            "stable" { "Stable public release." }
            default { throw "Unsupported release channel: $env:RELEASE_CHANNEL" }
          }

          # Baseline is the newest existing GitHub release on the same channel as this
          # release: stable diffs against the previous stable, rc against the previous rc,
          # beta against the previous beta. Channel is read from the enforced tag naming
          # contract (vX.Y.Z / -rc.N / -beta.N). The diff range uses target_commitish,
          # the commit SHA the release points at, so tags are not required locally.
          $channelPattern = switch ($env:RELEASE_CHANNEL) {
            "stable" { '^v\d+\.\d+\.\d+$' }
            "rc"     { '-rc\.\d+$' }
            "beta"   { '-beta\.\d+$' }
            default { throw "Unsupported release channel: $env:RELEASE_CHANNEL" }
          }
          $previousSha = $null
          $previousTagName = $null
          $releasesJson = (& gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" 2>$null)
          if ($LASTEXITCODE -ne 0) {
            throw "Could not list releases for $env:GITHUB_REPOSITORY."
          }
          $previousRelease = @($releasesJson | ConvertFrom-Json) |
            Where-Object { -not $_.draft -and $_.tag_name -match $channelPattern } |
            Select-Object -First 1
          if ($previousRelease -and $previousRelease.target_commitish -and $previousRelease.tag_name) {
            $previousSha = [string]$previousRelease.target_commitish
            $previousTagName = [string]$previousRelease.tag_name
          }

          if ($previousSha) {
            $commits = @(
              & git log --no-merges --format="%s" "$previousSha..HEAD" |
                Where-Object { $_.Trim() } |
                Select-Object -Unique
            )
            $compareLink = "https://github.com/$env:GITHUB_REPOSITORY/compare/$previousTagName...$env:RELEASE_TAG"
          } else {
            $commits = @(
              & git log --no-merges --format="%s" |
                Where-Object { $_.Trim() } |
                Select-Object -Unique
            )
            $compareLink = $null
          }

          # Group conventional-commit subjects by type; anything else lands in Other changes.
          $groups = @{
            "Features"      = [System.Collections.Generic.List[string]]::new()
            "Bug fixes"     = [System.Collections.Generic.List[string]]::new()
            "Performance"   = [System.Collections.Generic.List[string]]::new()
            "Other changes" = [System.Collections.Generic.List[string]]::new()
          }
          $conventionalPattern = '^(feat|fix|perf)(?:\([^)]*\))?:\s+(.+)$'
          foreach ($subject in $commits) {
            if ($subject -match $conventionalPattern) {
              $description = $Matches[2]
              switch ($Matches[1]) {
                "feat" { $groups["Features"].Add("- $description") }
                "fix"  { $groups["Bug fixes"].Add("- $description") }
                "perf" { $groups["Performance"].Add("- $description") }
              }
            } else {
              $groups["Other changes"].Add("- $subject")
            }
          }

          # Static sections are authored in this workflow, so they stay guarded against
          # test-only labels. Commit-derived lines are factual history and are not guarded.
          $staticHeader = @(
            "# PredatorLite v$env:RELEASE_VERSION",
            "",
            $distributionNotice,
            "",
            "PredatorLite is an independent, unofficial PredatorSense alternative for supported Acer Predator devices."
          ) -join [Environment]::NewLine

          $staticFooter = @(
            "## Requirements",
            "",
            "- .NET 10 Runtime x64",
            "- Windows App Runtime 2.3 x64",
            "- Native x64 Windows 11 24H2 or newer",
            "",
            "## Assets",
            "",
            "- PredatorLite-$env:RELEASE_VERSION-win-x64-portable.zip",
            "- PredatorLite-Setup-$env:RELEASE_VERSION-win-x64.exe",
            "- SHA-256 sidecar files for both assets",
            "",
            "Windows may show a SmartScreen reputation prompt the first time a newly published build is launched. Verify the matching SHA-256 sidecar before installation.",
            "",
            "PredatorLite is not an Acer product and is not affiliated with or endorsed by Acer."
          ) -join [Environment]::NewLine

          if (($staticHeader + $staticFooter) -match '(?i)unsigned|test-only|test-signed') {
            throw "Release notes contain a test-only label."
          }

          $sections = @($staticHeader, "", "## What's changed", "")
          if ($commits.Count -eq 0) {
            $sections += $(if ($previousTagName) { "No new commits since $previousTagName." } else { "Initial release." }), ""
          } else {
            foreach ($groupName in @("Features", "Bug fixes", "Performance", "Other changes")) {
              if ($groups[$groupName].Count -gt 0) {
                $sections += "### $groupName", ""
                foreach ($item in $groups[$groupName]) {
                  $sections += $item
                }
                $sections += ""
              }
            }
            if ($compareLink) {
              $sections += "**Full Changelog**: $compareLink", ""
            }
          }
          $sections += $staticFooter
          $finalNotes = $sections -join [Environment]::NewLine
          [System.IO.File]::WriteAllText(
            $env:RELEASE_NOTES_PATH,
            "$finalNotes$([Environment]::NewLine)",
            [System.Text.Encoding]::UTF8)

      - name: Create GitHub Release
        if: steps.release_state.outputs.should_publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_state.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release_state.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.release_state.outputs.channel }}
          RELEASE_IS_DRAFT: ${{ steps.release_state.outputs.is_draft }}
          RELEASE_IS_PRERELEASE: ${{ steps.release_state.outputs.is_prerelease }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}\predatorlite-release-notes.md
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDirectory = "publish\release"
          $assetPaths = @(
            (Join-Path $releaseDirectory "PredatorLite-$env:RELEASE_VERSION-win-x64-portable.zip"),
            (Join-Path $releaseDirectory "PredatorLite-$env:RELEASE_VERSION-win-x64-portable.zip.sha256"),
            (Join-Path $releaseDirectory "PredatorLite-Setup-$env:RELEASE_VERSION-win-x64.exe"),
            (Join-Path $releaseDirectory "PredatorLite-Setup-$env:RELEASE_VERSION-win-x64.exe.sha256")
          )
          $arguments = @(
            "release",
            "create",
            $env:RELEASE_TAG
          ) + $assetPaths + @(
            "--repo", $env:GITHUB_REPOSITORY,
            "--target", $env:GITHUB_SHA,
            "--title", $(switch ($env:RELEASE_CHANNEL) {
              "beta" { "PredatorLite $env:RELEASE_TAG (Internal Beta)" }
              "rc" { "PredatorLite $env:RELEASE_TAG (Release Candidate)" }
              "stable" { "PredatorLite $env:RELEASE_TAG" }
              default { throw "Unsupported release channel: $env:RELEASE_CHANNEL" }
            }),
            "--notes-file", $env:RELEASE_NOTES_PATH
          )
          if ($env:RELEASE_IS_DRAFT -eq "true") {
            $arguments += "--draft"
          }
          if ($env:RELEASE_IS_PRERELEASE -eq "true") {
            $arguments += "--prerelease"
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed with exit code $LASTEXITCODE."
          }
          Write-Host "Created GitHub $env:RELEASE_CHANNEL release $env:RELEASE_TAG."
