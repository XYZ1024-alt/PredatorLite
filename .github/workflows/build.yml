name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PredatorLite.slnx

      - name: Audit dependencies
        run: dotnet list PredatorLite.slnx package --vulnerable --include-transitive --no-restore

      - name: Build
        run: dotnet build PredatorLite.slnx -c Release --no-restore --nologo

      - name: Format
        run: dotnet format PredatorLite.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Test
        run: dotnet test PredatorLite.slnx -c Release --no-build --nologo

      - name: Publish
        shell: pwsh
        run: .\build\publish.ps1 -Configuration Release -OutputPath publish\win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: PredatorLite-win-x64
          path: publish/win-x64
