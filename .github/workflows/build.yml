name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install pinned Inno Setup
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $uri = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $expectedHash = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          $installDirectory = Join-Path $env:RUNNER_TEMP "Inno Setup 6"
          Invoke-WebRequest -Uri $uri -OutFile $installer
          $stream = [System.IO.File]::OpenRead($installer)
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          try {
            $actualHash = ($sha256.ComputeHash($stream) | ForEach-Object { $_.ToString("x2") }) -join ""
          } finally {
            $sha256.Dispose()
            $stream.Dispose()
          }
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup installer hash mismatch: $actualHash"
          }
          $process = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/CURRENTUSER",
            "/DIR=`"$installDirectory`""
          ) -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)"
          }
          $compiler = Join-Path $installDirectory "ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "ISCC.exe was not installed to $installDirectory"
          }
          "INNO_SETUP_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore dependencies
        run: dotnet restore PredatorLite.slnx

      - name: Audit dependencies
        run: dotnet package list --project PredatorLite.slnx --vulnerable --include-transitive --no-restore

      - name: Build
        run: dotnet build PredatorLite.slnx -c Release --no-restore --nologo

      - name: Format
        run: dotnet format PredatorLite.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Test
        run: dotnet test PredatorLite.slnx -c Release --no-build --nologo

      - name: Publish portable test layout
        shell: pwsh
        run: .\build\publish.ps1 -Configuration Release -OutputPath publish\win-x64

      - name: Build unsigned installer test artifact
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: .\build\build-installer.ps1 -SkipSigning

      - name: Validate unsigned installer test artifact
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $outputDirectory = "artifacts\installer\unsigned"
          $entries = @(Get-ChildItem -LiteralPath $outputDirectory -Force)
          $setups = @($entries | Where-Object { -not $_.PSIsContainer -and $_.Name -like "*-unsigned.exe" })
          if ($setups.Count -ne 1) {
            throw "Expected exactly one unsigned Setup executable."
          }
          $setup = $setups[0]
          $checksumPath = "$($setup.FullName).sha256"
          $expectedNames = @($setup.Name, "$($setup.Name).sha256")
          $unexpectedEntries = @($entries | Where-Object { $_.PSIsContainer -or $_.Name -notin $expectedNames })
          if ($entries.Count -ne 2 -or $unexpectedEntries.Count -ne 0) {
            throw "Unsigned installer output must contain only Setup and its checksum."
          }

          $checksumLine = [System.IO.File]::ReadAllText(
            $checksumPath,
            [System.Text.Encoding]::ASCII).Trim()
          if ($checksumLine -notmatch '^(?<Hash>[0-9a-f]{64})  (?<Name>[^\\/:*?"<>|]+)$' -or
              $Matches.Name -ne $setup.Name) {
            throw "Unsigned installer checksum file has an invalid format."
          }
          $stream = [System.IO.File]::OpenRead($setup.FullName)
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          try {
            $actualHash = ($sha256.ComputeHash($stream) | ForEach-Object { $_.ToString("x2") }) -join ""
          } finally {
            $sha256.Dispose()
            $stream.Dispose()
          }
          if ($actualHash -ne $Matches.Hash) {
            throw "Unsigned installer checksum mismatch: $actualHash"
          }

          $stream = [System.IO.File]::OpenRead($setup.FullName)
          $peReader = [System.Reflection.PortableExecutable.PEReader]::new($stream)
          try {
            if ($peReader.PEHeaders.PEHeader.CertificateTableDirectory.Size -ne 0) {
              throw "Unsigned installer unexpectedly contains an Authenticode certificate table."
            }
          } finally {
            $peReader.Dispose()
            $stream.Dispose()
          }
          Write-Host "Validated unsigned installer: $($setup.Name)"

      - name: Add unsigned artifact notices
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $portableNotice = @(
            "UNSIGNED TEST BUILD",
            "",
            "This portable build is a temporary GitHub Actions artifact.",
            "It has no publicly trusted Authenticode signature.",
            "Do not attach it to a GitHub Release or present it as a production release."
          ) -join [Environment]::NewLine
          $installerNotice = @(
            "UNSIGNED TEST BUILD",
            "",
            "This installer is a temporary GitHub Actions artifact.",
            "It has no publicly trusted Authenticode signature.",
            "Do not attach it to a GitHub Release or present it as a production release."
          ) -join [Environment]::NewLine
          [System.IO.File]::WriteAllText(
            "publish\win-x64\UNSIGNED-TEST-ONLY.txt",
            "$portableNotice$([Environment]::NewLine)",
            [System.Text.Encoding]::ASCII)
          [System.IO.File]::WriteAllText(
            "artifacts\installer\unsigned\UNSIGNED-TEST-ONLY.txt",
            "$installerNotice$([Environment]::NewLine)",
            [System.Text.Encoding]::ASCII)

      - name: Upload unsigned portable test artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PredatorLite-win-x64-portable-UNSIGNED-TEST-ONLY
          path: publish/win-x64
          retention-days: 14
          if-no-files-found: error

      - name: Upload unsigned installer test artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PredatorLite-installer-UNSIGNED-TEST-ONLY
          path: |
            artifacts/installer/unsigned/*-unsigned.exe
            artifacts/installer/unsigned/*-unsigned.exe.sha256
            artifacts/installer/unsigned/UNSIGNED-TEST-ONLY.txt
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
