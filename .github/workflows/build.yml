name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install pinned Inno Setup
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $uri = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $expectedHash = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          $installDirectory = Join-Path $env:RUNNER_TEMP "Inno Setup 6"
          Invoke-WebRequest -Uri $uri -OutFile $installer
          $stream = [System.IO.File]::OpenRead($installer)
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          try {
            $actualHash = ($sha256.ComputeHash($stream) | ForEach-Object { $_.ToString("x2") }) -join ""
          } finally {
            $sha256.Dispose()
            $stream.Dispose()
          }
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup installer hash mismatch: $actualHash"
          }
          $process = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/CURRENTUSER",
            "/DIR=`"$installDirectory`""
          ) -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)"
          }
          $compiler = Join-Path $installDirectory "ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "ISCC.exe was not installed to $installDirectory"
          }
          "INNO_SETUP_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore dependencies
        run: dotnet restore PredatorLite.slnx

      - name: Audit dependencies
        run: dotnet package list --project PredatorLite.slnx --vulnerable --include-transitive --no-restore

      - name: Build
        run: dotnet build PredatorLite.slnx -c Release --no-restore --nologo

      - name: Format
        env:
          Configuration: Release
        run: dotnet format PredatorLite.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Test
        run: dotnet test PredatorLite.slnx -c Release --no-build --nologo

      - name: Benchmark smoke
        run: dotnet run --project benchmarks/PredatorLite.Benchmarks/PredatorLite.Benchmarks.csproj -c Release --no-build -- --job Dry --filter "*"

      - name: Publish framework-dependent IL validation layout
        shell: pwsh
        run: .\build\publish.ps1 -Configuration Release -OutputPath publish\win-x64-il -ReadyToRun:$false

      - name: Publish framework-dependent ReadyToRun test layout
        shell: pwsh
        run: .\build\publish.ps1 -Configuration Release -OutputPath publish\win-x64

      - name: Build formal installer artifact
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: .\build\build-installer.ps1 -SkipSigning -PublicRelease

      - name: Validate formal installer artifact
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          [xml]$buildProperties = Get-Content -LiteralPath "Directory.Build.props"
          $version = [string]($buildProperties.Project.PropertyGroup.Version | Select-Object -First 1)
          $outputDirectory = "publish\installer"
          $expectedSetupName = "PredatorLite-Setup-$version-win-x64.exe"
          $entries = @(Get-ChildItem -LiteralPath $outputDirectory -Force)
          $setups = @($entries | Where-Object { -not $_.PSIsContainer -and $_.Name -eq $expectedSetupName })
          if ($setups.Count -ne 1) {
            throw "Expected exactly one formal Setup executable named $expectedSetupName."
          }
          if (@($entries | Where-Object { $_.PSIsContainer -or $_.Name -match '(?i)unsigned|test-only|test-signed' }).Count -ne 0) {
            throw "Formal installer output contains a test-only name or directory."
          }
          $setup = $setups[0]
          $checksumPath = "$($setup.FullName).sha256"
          $expectedNames = @($setup.Name, "$($setup.Name).sha256")
          $unexpectedEntries = @($entries | Where-Object { $_.PSIsContainer -or $_.Name -notin $expectedNames })
          if ($entries.Count -ne 2 -or $unexpectedEntries.Count -ne 0) {
            throw "Formal installer output must contain only Setup and its checksum."
          }

          $checksumLine = [System.IO.File]::ReadAllText(
            $checksumPath,
            [System.Text.Encoding]::ASCII).Trim()
          if ($checksumLine -notmatch '^(?<Hash>[0-9a-f]{64})  (?<Name>[^\\/:*?"<>|]+)$' -or
              $Matches.Name -ne $setup.Name) {
            throw "Formal installer checksum file has an invalid format."
          }
          $stream = [System.IO.File]::OpenRead($setup.FullName)
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          try {
            $actualHash = ($sha256.ComputeHash($stream) | ForEach-Object { $_.ToString("x2") }) -join ""
          } finally {
            $sha256.Dispose()
            $stream.Dispose()
          }
          if ($actualHash -ne $Matches.Hash) {
            throw "Formal installer checksum mismatch: $actualHash"
          }

          $stream = [System.IO.File]::OpenRead($setup.FullName)
          $peReader = [System.Reflection.PortableExecutable.PEReader]::new($stream)
          try {
            if ($peReader.PEHeaders.PEHeader.CertificateTableDirectory.Size -ne 0) {
              throw "Formal installer unexpectedly contains an Authenticode certificate table."
            }
          } finally {
            $peReader.Dispose()
            $stream.Dispose()
          }
          Write-Host "Validated formal installer: $($setup.Name)"

      - name: Upload portable artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PredatorLite-win-x64-portable
          path: publish/win-x64
          retention-days: 14
          if-no-files-found: error

      - name: Upload installer artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PredatorLite-installer
          path: |
            publish/installer/PredatorLite-Setup-*.exe
            publish/installer/PredatorLite-Setup-*.exe.sha256
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
