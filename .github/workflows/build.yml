name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore PredatorLite.slnx

      - name: Audit dependencies
        run: dotnet package list --project PredatorLite.slnx --vulnerable --include-transitive --no-restore

      - name: Build
        run: dotnet build PredatorLite.slnx -c Release --no-restore --nologo

      - name: Format
        run: dotnet format PredatorLite.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Test
        run: dotnet test PredatorLite.slnx -c Release --no-build --nologo

      - name: Publish
        shell: pwsh
        run: .\build\publish.ps1 -Configuration Release -OutputPath publish\win-x64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PredatorLite-win-x64
          path: publish/win-x64
          retention-days: 14
          if-no-files-found: error
